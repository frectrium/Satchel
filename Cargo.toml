[workspace]
resolver = "2"
members = [
    "crates/satchel-common",
    "crates/satchel-api",
    "crates/satchel-index",
    "crates/satchel-node",
    "crates/satchel-verifier",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/frectrium/Satchel"

[workspace.dependencies]
satchel-common = { path = "crates/satchel-common" }

anyhow = "1"
axum = "0.8"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
