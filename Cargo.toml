[workspace]
resolver = "2"
members = [
    "crates/satchel-common",
    "crates/satchel-api",
    "crates/satchel-index",
    "crates/satchel-node",
    "crates/satchel-verifier",
    "crates/satchel-it",
    "crates/satchel-bench",
    "crates/satchel-cost",
    "crates/satchel-files",
    "crates/satchel-calc",
]

[workspace.package]
version = "1.1.0"
edition = "2021"
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/frectrium/Satchel"

[workspace.dependencies]
satchel-common = { path = "crates/satchel-common" }

anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
hex = "0.4"
prometheus = { version = "0.14", default-features = false, features = ["process"] }
reed-solomon-erasure = "6.0"
reqwest = { version = "0.13", default-features = false }
rusqlite = { version = "0.41", features = ["bundled", "fallible_uint"] }
rusty-s3 = { version = "0.11", default-features = false, features = ["rustcrypto"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
toml = "1.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ureq = { version = "3.4", default-features = false, features = ["json"] }
# Must match the wasm-bindgen CLI that builds web/calculator/pkg.
wasm-bindgen = "=0.2.130"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
