name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: rustfmt, clippy
          cache: false
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked
      - name: Test
        run: cargo test --workspace --locked

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: satchel:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Validate docker-compose.yml
        run: docker compose config --quiet

  integration:
    name: Integration tests (Compose)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Build satchel:dev once, from the layer cache the docker job fills, so
      # Compose doesn't build it once per service.
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: satchel:dev
          cache-from: type=gha
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
      - name: Start the cluster, run the tests, tear down
        run: scripts/integration-test.sh
        env:
          SATCHEL_IT_SKIP_BUILD: "1"

  terraform:
    name: Terraform (fmt, validate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.2
      - name: Format
        run: terraform fmt -check -recursive
      - name: Initialize without a backend
        run: terraform init -backend=false -input=false
      - name: Validate
        run: terraform validate
