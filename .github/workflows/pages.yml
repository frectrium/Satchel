name: Publish calculator

# Publishes the calculator page (#54) to GitHub Pages from main. The page is
# static: the committed WASM bundle in web/calculator/pkg does all the work.
# Needs Settings > Pages > Source set to "GitHub Actions".

on:
  push:
    branches: [main]
    paths: ["web/calculator/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Check the bundle matches the CLI
        run: node web/calculator/smoke.mjs
      - name: Copy the page without the test script
        run: |
          mkdir -p _site
          cp -r web/calculator/index.html web/calculator/app.js web/calculator/style.css web/calculator/pkg _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
