version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
    labels: ["type: chore"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: ["type: chore"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    labels: ["type: chore"]
