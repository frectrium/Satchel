# Local development cluster: one frontend, one Block Index, one verifier and
# one storage node in each of three simulated zones (z1, z2, z3), mirroring
# the three availability zones of ap-south-1. Prometheus and Grafana scrape
# every service (#21).
#
#   docker compose up --build
#   curl localhost:8080/health
#   open http://localhost:3000   # Grafana, "Satchel overview" dashboard

x-satchel: &satchel
  image: satchel:dev
  build: .
  restart: unless-stopped
  environment: &env
    RUST_LOG: ${RUST_LOG:-info}
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS http://localhost:$${SATCHEL_PORT}/health || exit 1"]
    interval: 10s
    timeout: 2s
    retries: 3

services:
  api:
    <<: *satchel
    command: satchel-api
    environment: { <<: *env, SATCHEL_PORT: "8080", SATCHEL_INDEX_URL: "http://index:8081", SATCHEL_NODES: &nodes "node-z1-1@z1=http://node-z1-1:8090,node-z1-2@z1=http://node-z1-2:8090,node-z1-3@z1=http://node-z1-3:8090,node-z2-1@z2=http://node-z2-1:8090,node-z2-2@z2=http://node-z2-2:8090,node-z2-3@z2=http://node-z2-3:8090,node-z3-1@z3=http://node-z3-1:8090,node-z3-2@z3=http://node-z3-2:8090,node-z3-3@z3=http://node-z3-3:8090" }
    ports: ["8080:8080"]
    depends_on: [index, node-z1-1, node-z1-2, node-z1-3, node-z2-1, node-z2-2, node-z2-3, node-z3-1, node-z3-2, node-z3-3]

  index:
    <<: *satchel
    command: satchel-index
    environment: { <<: *env, SATCHEL_PORT: "8081" }
    ports: ["8081:8081"]

  node-z1-1:
    <<: *satchel
    command: satchel-node
    environment: { <<: *env, SATCHEL_PORT: "8090", SATCHEL_ZONE: z1 }
    ports: ["8091:8090"]
    volumes: ["node-z1-1:/data"]

  node-z1-2:
    <<: *satchel
    command: satchel-node
    environment: { <<: *env, SATCHEL_PORT: "8090", SATCHEL_ZONE: z1 }
    ports: ["8092:8090"]
    volumes: ["node-z1-2:/data"]

  node-z1-3:
    <<: *satchel
    command: satchel-node
    environment: { <<: *env, SATCHEL_PORT: "8090", SATCHEL_ZONE: z1 }
    ports: ["8093:8090"]
    volumes: ["node-z1-3:/data"]

  node-z2-1:
    <<: *satchel
    command: satchel-node
    environment: { <<: *env, SATCHEL_PORT: "8090", SATCHEL_ZONE: z2 }
    ports: ["8094:8090"]
    volumes: ["node-z2-1:/data"]

  node-z2-2:
    <<: *satchel
    command: satchel-node
    environment: { <<: *env, SATCHEL_PORT: "8090", SATCHEL_ZONE: z2 }
    ports: ["8095:8090"]
    volumes: ["node-z2-2:/data"]

  node-z2-3:
    <<: *satchel
    command: satchel-node
    environment: { <<: *env, SATCHEL_PORT: "8090", SATCHEL_ZONE: z2 }
    ports: ["8096:8090"]
    volumes: ["node-z2-3:/data"]

  node-z3-1:
    <<: *satchel
    command: satchel-node
    environment: { <<: *env, SATCHEL_PORT: "8090", SATCHEL_ZONE: z3 }
    ports: ["8097:8090"]
    volumes: ["node-z3-1:/data"]

  node-z3-2:
    <<: *satchel
    command: satchel-node
    environment: { <<: *env, SATCHEL_PORT: "8090", SATCHEL_ZONE: z3 }
    ports: ["8098:8090"]
    volumes: ["node-z3-2:/data"]

  node-z3-3:
    <<: *satchel
    command: satchel-node
    environment: { <<: *env, SATCHEL_PORT: "8090", SATCHEL_ZONE: z3 }
    ports: ["8099:8090"]
    volumes: ["node-z3-3:/data"]

  verifier:
    <<: *satchel
    command: satchel-verifier
    environment: { <<: *env, SATCHEL_PORT: "8085", SATCHEL_INDEX_URL: "http://index:8081", SATCHEL_NODES: *nodes }
    ports: ["8085:8085"]
    depends_on: [index]

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    ports: ["9090:9090"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    environment:
      # Local only: anyone on this machine can view the dashboards.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/satchel-overview.json
    ports: ["3000:3000"]
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]

volumes:
  node-z1-1:
  node-z1-2:
  node-z1-3:
  node-z2-1:
  node-z2-2:
  node-z2-3:
  node-z3-1:
  node-z3-2:
  node-z3-3:
  prometheus:
