# Local development cluster: one frontend, one Block Index, one verifier and
# one storage node in each of three simulated zones (z1, z2, z3), mirroring
# the three availability zones of ap-south-1. Prometheus and Grafana scrape
# every service (#21).
#
#   docker compose up --build
#   curl localhost:8080/health
#   open http://localhost:3000   # Grafana, "Satchel overview" dashboard

x-satchel: &satchel
  image: satchel:dev
  build: .
  restart: unless-stopped
  environment: &env
    RUST_LOG: ${RUST_LOG:-info}
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS http://localhost:$${SATCHEL_PORT}/health || exit 1"]
    interval: 10s
    timeout: 2s
    retries: 3

services:
  api:
    <<: *satchel
    command: satchel-api
    environment:
      <<: *env
      SATCHEL_PORT: "8080"
      SATCHEL_INDEX_URL: http://index:8081
      SATCHEL_NODES: node-z1@z1=http://node-z1:8090,node-z2@z2=http://node-z2:8090,node-z3@z3=http://node-z3:8090
    ports: ["8080:8080"]
    depends_on: [index, node-z1, node-z2, node-z3]

  index:
    <<: *satchel
    command: satchel-index
    environment: { <<: *env, SATCHEL_PORT: "8081", SATCHEL_DATA_DIR: /data }
    ports: ["8081:8081"]
    volumes: ["index:/data"]

  node-z1:
    <<: *satchel
    command: satchel-node
    environment: { <<: *env, SATCHEL_PORT: "8090", SATCHEL_ZONE: z1 }
    ports: ["8091:8090"]
    volumes: ["node-z1:/data"]

  node-z2:
    <<: *satchel
    command: satchel-node
    environment: { <<: *env, SATCHEL_PORT: "8090", SATCHEL_ZONE: z2 }
    ports: ["8092:8090"]
    volumes: ["node-z2:/data"]

  node-z3:
    <<: *satchel
    command: satchel-node
    environment: { <<: *env, SATCHEL_PORT: "8090", SATCHEL_ZONE: z3 }
    ports: ["8093:8090"]
    volumes: ["node-z3:/data"]

  verifier:
    <<: *satchel
    command: satchel-verifier
    environment:
      <<: *env
      SATCHEL_PORT: "8085"
      SATCHEL_INDEX_URL: http://index:8081
      SATCHEL_NODES: node-z1@z1=http://node-z1:8090,node-z2@z2=http://node-z2:8090,node-z3@z3=http://node-z3:8090
      # Pocket Watch scrubs every 1 to 2 weeks [B3]. The lab cluster is small,
      # so once a minute keeps the failure tests short.
      SATCHEL_VERIFY_EVERY_SECS: "60"
      # 15 minutes in Magic Pocket [B2]. 30 s in tests and experiments (DDL-010).
      SATCHEL_REPAIR_AFTER: 30s
    ports: ["8085:8085"]
    depends_on: [index, node-z1, node-z2, node-z3]

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    ports: ["9090:9090"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    environment:
      # Local only: anyone on this machine can view the dashboards.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/satchel-overview.json
    ports: ["3000:3000"]
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]

volumes:
  index:
  node-z1:
  node-z2:
  node-z3:
  prometheus:
